services:
  aexus:
    build: .
    container_name: aexus
    restart: unless-stopped

    ports:
      - "1000:1000"

    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads

    environment:
      - TZ=America/New_York