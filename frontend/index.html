<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aexus</title>

    <link rel="stylesheet" href="css/main.css">

</head>
<body>
<div class="background"></div>
<div class="aexus-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h1>
                Aexus
            </h1>
        </div>
        <nav>
            <button class="nav-item active">
                🏠 Home
            </button>
            <button class="nav-item">
                ⭐ Favorites
            </button>
            <button class="nav-item">
                📦 Apps
            </button>
            <button class="nav-item">
                📊 System
            </button>
            <button class="nav-item">
                ⚙ Settings
            </button>
        </nav>
    </aside>
    <!-- Main Dashboard -->
    <main class="dashboard">
        <!-- Top Bar -->
        <header class="topbar">
            <div>
                <h2>
                    Good Evening 👋
                </h2>
                <p>
                    Welcome back to Aexus
                </p>
            </div>
            <div class="clock">

                8:47 PM

            </div>
        </header>
        <!-- Search -->
        <div class="search-box">
            <input 
            type="text"
            placeholder="Search apps..."
            >
        </div>
        <!-- Applications -->
        <section class="section">
            <h3>
                Applications
            </h3>
            <div class="app-grid" id="appGrid"></div>
        </section>
        <!-- Widgets -->
        <section class="section">
            <h3>
                Widgets
            </h3>
            <div class="widget-grid">
                <div class="widget">
                    <h4>
                        CPU
                    </h4>
                    <p>
                        -- %
                    </p>
                </div>
                <div class="widget">
                    <h4>
                        Memory
                    </h4>
                    <p>
                        -- GB
                    </p>
                </div>
                <div class="widget">
                    <h4>
                        Storage
                    </h4>
                    <p>
                        -- %
                    </p>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
